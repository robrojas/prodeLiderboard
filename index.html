<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Palmarés del Prode Familia Granados — Copa Mundial, Eurocopa, Copa América y Mundial de Clubes desde 2018." />
    <meta name="theme-color" content="#08090c" />
    <title>Prode Familia Granados — Palmarés</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <p class="header__badge">⚽ Desde 2018</p>
        <h1 class="header__title">Prode Familia <span>Granados</span></h1>
        <p class="header__subtitle">Palmarés</p>
      </header>

      <section class="stats" aria-label="Estadísticas">
        <div class="stat">
          <span class="stat__value" id="stat-tournaments">—</span>
          <span class="stat__label">Torneos</span>
        </div>
        <div class="stat">
          <span class="stat__value" id="stat-winners">—</span>
          <span class="stat__label">Campeones</span>
        </div>
        <div class="stat">
          <span class="stat__value" id="stat-years">—</span>
          <span class="stat__label">Temporada</span>
        </div>
      </section>

      <nav class="filters" aria-label="Filtrar por torneo">
        <button class="filter-btn active" data-filter="all" type="button">Todos</button>
        <button class="filter-btn" data-filter="mundial" type="button">Copa Mundial</button>
        <button class="filter-btn" data-filter="euro" type="button">Eurocopa</button>
        <button class="filter-btn" data-filter="copa-america" type="button">Copa América</button>
        <button class="filter-btn" data-filter="mundial-clubes" type="button">Mundial de Clubes</button>
      </nav>

      <section class="cards" id="cards" aria-label="Lista de ganadores"></section>

      <p class="empty-state" id="empty-state">No hay torneos en esta categoría.</p>

      <footer class="footer">
        <p>Prode Familia Granados · Hecho con ⚽ para la familia</p>
      </footer>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
